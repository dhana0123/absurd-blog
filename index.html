<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absurd Fictional Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="shell">
  <nav class="sidebar">
    <h1><a href="index.html">Absurd Fictional Blog</a></h1>
    <p>Thoughts, stories and experiments by Santhosh.</p>

    <ul class="posts">
      <!-- Add new posts at the top: slug is the file name in posts/ without .html -->
      <li><a href="posts/phase-zero.html" target="content" data-slug="phase-zero">Phase 0: Moving Beyond Biology<br><span class="date">2026-11-12</span></a></li>
    </ul>

    <p class="side-note">Fictional personal thoughts. Not related to any company. See the disclaimer on each post.</p>
  </nav>

  <main class="content">
    <iframe name="content" title="Post" src="posts/phase-zero.html"></iframe>
  </main>

  <script>
    // Deep links: index.html#phase-zero opens that post; clicking a post updates the hash.
    var frame = document.querySelector('iframe');
    var links = document.querySelectorAll('.posts a');

    function setActive(slug) {
      links.forEach(function (a) {
        a.classList.toggle('active', a.dataset.slug === slug);
      });
    }

    function openFromHash() {
      var slug = location.hash.slice(1);
      var link = slug && document.querySelector('.posts a[data-slug="' + CSS.escape(slug) + '"]');
      if (!link) link = links[0];
      if (!link) return;
      frame.src = link.getAttribute('href');
      setActive(link.dataset.slug);
    }

    links.forEach(function (a) {
      a.addEventListener('click', function () {
        history.replaceState(null, '', '#' + a.dataset.slug);
        setActive(a.dataset.slug);
      });
    });

    window.addEventListener('hashchange', openFromHash);
    openFromHash();
  </script>
</body>
</html>
